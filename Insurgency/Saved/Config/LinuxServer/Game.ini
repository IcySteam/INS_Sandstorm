[/GunFrenzy/Mutators/GunFrenzy.GunFrenzy_C]
;Config Variable
;
;How many tiers of weapons to push player back on death in addition to losing upgrades for checkpoint mode. Default is 0
NumTiersResetCheckpoint=0
;How many tiers of weapons to push player back on death in addition to losing upgrades for survival mode. Default is 0
NumTiersResetSurvival=0

;If set to False, then the resupply crates will remain in game and mag grab can be used. Resupply will simply give a new weapon of the same tier with no upgrades. Default is True
bRemoveCheckpointCrates=True
;If set to True, this will reset player points to StartingPoints on death. Default is False
bResetPointsOnDeath=False
;If set to False, then players will not lose any upgrades on death and on respawn will be given weapons with upgrades already earned attached. This only works if bResetPointsOnDeath is set to False, as it has priority. Default is True
bResetUpgradesOnDeath=True
;If set this will reset point to StartingPoints on round over. Default is True
bResetPointsOnReset=True

;How many points to award on bot kill. Default is 20
KillIncrement=20
;How many points to award on blowing cache. Default is 80
CacheIncrement=80
;How many points to award when on point capturing per tick. Default is 10
ProgressTickIncrement=10
;How many to cap player points at during capture. This removes the ability of farming points when bots are recapturing. Default is 80
MaxPointsForCap=80
;How many points are required before giving next tier weapon. Default is 300
PointsForWeapon=300
;How many points are required before upgrading the current weapon. Upgrades will be awarded between weapons. So using defaults an upgrade would be awarded at 240, 280, 320, and 360. A new weapon at 400 and an upgrade at 440, 480, 520, etc. Default is 40
PointsForUpgrade=40
;How many points are required before giving player explosives, if slots are available. Default is 150
PointsForEquipment=150
;How many points are required before giving player a second primary slot. This is only for scavenging and nothing will be awarded to this slot or upgraded from it. This enables a player to scavenge a bots weapons once they've unlocked all tiers and can have a backup weapon. Default is 2400
PointsForScavenge=2400
;How many points are required before giving player both radio and binocs for calling in fire support. Default is 1600
PointsForFireSupport=1600
;How many points should player start with and be given on reset if bResetPointsOnDeath is set to True. Default is 100
;[ATTENTION HERE] Change between Frenzy and Co-Op configs
StartingPoints=100 ; Default 100 for Co-Op and 600 for Frenzy
;The max number of upgrades to make to a given weapon. Most weapons typically have up to 5 upgrades allowed at once in loadout. Default is 8
MaxUpgrades=8

;This will print to the clients chat the name of the upgrade added. Default is True
bStateUpgradeName=True
;This enables the HUD at the start of the first round and the Gun Frenzy center text. Typing !info will reprint the info/scores to chat for all players. Default is True
bEnableInfo=True
;Message to print to player when explosive is given. Default is: "Explosive Gained"
NewFragMsg="Explosive Gained"
;Message to print to player when Fire Support is given. Default is: "Fire Support Unlocked"
FireSupportMsg="Fire Support Unlocked"
;Message to print to player when second primary slot is earned. Default is: "Scavenge Slot Unlocked"
ScavengeMsg="Scavenging Slot Unlocked"
;If set to True this will print the players score to the text channel on every change. Default is False
bEnableScorePrinting=False
;If set to True, this will disable the ability to equip the high damage explosives and only allows the vanilla ones. The rewarded explosives will also be vanilla. They will still show up in the loadout menu, but unequipable. Default is False
VanillaFrags=False

;Mag Grab Crate Config Variables
;
;If set to True, then the player will not be respawned at mag grab crates in Survival. Default is False
bDisableRespawnCrate=False
;Maximum number of mag grab crates to allow to be spawned at a time. Once this is hit, the oldest will be destroyed. Default is 3
MagGrabLimit=5
;How long the players will be respawned at the last objective before spawning at crates. Default is 25.0 seconds
SpawnAtObjectiveTime=25.0
;How many spawns at the last placed crate before randomly picking a crate to respawn at. Default is 1
NumSpawnsBeforeRandom=1

;General Settings Overridden
;
;If set to True, then the below bot count values will override the game settings set under the Checkpoint or Survival headers in your game.ini. This allows for a unique bot count when using GunFrenzy in checkpoint or survival, while keeping normal bot counts without GunFrenzy. Default is True
bUseBotAdjustments=True
;[ATTENTION HERE] Change between Frenzy and Co-Op configs
;Number of bot when in single player.
MinimumEnemies=10
;Number of bots when at max players.
MaximumEnemies=50
;Number of bots to add per objective at minimum player count. This can be a fraction so 0.5 would add 1 bot every two objectives. This override is only for GunFrenzy and will not affect vanilla. Default is 0.0
MinBotsPerCompletedObjective=0.0
;Number of bots to add per objective at maximum player count. This can be a fraction so 0.5 would add 1 bot every two objectives. This override is only for GunFrenzy and will not affect vanilla. Default is 1.0
MaxBotsPerCompletedObjective=1.0
;Overrides the default time in seconds a dropped gun will be on the ground for before being destroyed. This is solely for GunFrenzy mode to stop players from looting overpowered weapons. Default is 0.1
DroppedWeaponLifespan=0.1
;Dropped weapon lifespan in seconds when any player has unlocked the scavenge slot. This enables player to pick up weapons after having unlocked all weapons and have an extra slot for a scavenged weapon. Weapon lifespan is still kept short. Default is 10
DroppedWeaponLifespanAfterUpgrade=10
;Player health and speed override for easier gameplay. Set accordingly: 0 - 1.25x speed and 200 health. 1 - 1.1x speed and 150 health. 2 - vanilla with nothing overridden. Default is 2
Difficulty=2

;Additional Settings
MagUpgradeRatio=0.6 	;This is the ratio of the max ammo the player can handle to award the player if the ammo gain upgrade is gained. Default is 0.5
bEnableAmmoGain=True	;This enables mags/rounds to be awarded to player instead of an upgrade when players ammo gets low. This will still be random. Default is True.
;ReserveRoundsToAwardAmmo	;If bEnableAmmoGain is True, then this sets the max amount of reserve ammo for shotguns/bolt action before a player may be awarded extra rounds
;ReserveMagsToAwardAmmo	;If bEnableAmmoGain is True, then this sets the max amount of reserve ammo for rifles action before a player may be awarded extra mags
bDisableHUD=False	;If set to True, then this is disable the Gun Frenzy title at the start of the first round. The info message to chat is controlled seperately with bEnableInfo. Default is False. 
bDisableForegrips=False	;If set to True, this will pull all foregrips from the rotation. Foregrips require a respawn of the weapon. This is only for servers. Default is False.
MinSecondaryMag=2	;Minimum mags to give for secondary weapons on magazine upgrade awarded. Default is 2
MinPrimaryMag=1	;Minimum mags to give for primary weapons on magazine upgrade awarded. Default is 1
DrumMagChance=0.2	;Chance of a drum mag to be chosen for a mag upgrade. Default is 0.2, so 20% of drum mag and 80% chance of extended mag.
QueueLoopTimer=0.1	;This sets how often (in seconds) a players status will be checked to see if they're still busy and not ready for an upgrade. Default is 0.1. PlayerNotBusyLength will check for 50 0.1second intervals of the player not being busy before upgrading. If not busy for the 50 checks, then the upgrade/weapon will be awarded.
PlayerNotBusyLength=50	;This controls how long to wait while player is not reloading, shooting, or ADS before giving upgrade. Default is 50, which corresponds to ~5 seconds.
PointShootingChance=0	;Additional control to make point shooting more or less likely compared to optics. This is the probability of always choosing laser point shooting, if the upgrade slot is chosen and laser/optic have not already been equipped. Default is 0.6, which makes it reasonably likely when compared to optics. Reduce for less likely and increase for more.
DisableResupplyTime=45	;This sets the amount of time to force player to be re-given the same weapons at start. This stops players from resupplying until they get their favorite weapons. Default is 45.
ReduceMagCount=1	;When awarding new weapons this can be adjusted to reduce the number of mags a player by default gets. Default is 1, which corresponds to the number a player should hold with the carriers allowed.

;Separate Survival Settings
bUseSurvivalSettings=False	;If True, then the following bold settings will be used instead of the default ones above for Survival Mode. These are the same settings as described above, but with Survival added to the end.
bResetUpgradesOnDeathSurvival=True
DroppedWeaponLifespawnSurvival=0.1
DifficultySurvival=2
;[ATTENTION HERE] Change between Frenzy and Co-Op configs
StartingPointsSurvival=100 ; Default 100 for Co-Op and 600 for Frenzy


[/Gravity/Mutators/Gravity.Gravity_C]
;Gravity can be any integer from 1-20, where 1 corresponds to a gravity of 0.1 (flying), 10 is 1.0 (vanilla), and 20 corresponds to 2.0 (you aint winning any vaulting contests anytime soon). Default is 6, which is 0.6 gravity and will enable some rooftop jumps and window dives that were not possible before.
